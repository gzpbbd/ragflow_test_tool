<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助手对话</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: calc(100vh - 180px);
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .typing-animation::after {
            content: '▋';
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .message {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: #e3f2fd;
            border-radius: 15px 15px 2px 15px;
        }

        .assistant-message {
            background: #f5f5f5;
            border-radius: 15px 15px 15px 2px;
        }

        .message-wrapper {
            display: flex;
            align-items: flex-start;
            margin: 1rem 0;
            gap: 8px;
        }

        .message-wrapper.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .message-content {
            max-width: calc(100% - 100px);
        }

        .elapsed-time {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            padding: 1.5rem 0 1.5rem 1.5rem;
            overflow-y: auto;
        }

        .main-content {
            margin-left: 280px;
            height: 100vh;
            overflow-y: auto;
            padding: 1.5rem;
        }

        /* 自定义滚动条 */
        .chat-container::-webkit-scrollbar,
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track,
        .sidebar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-container::-webkit-scrollbar-thumb,
        .sidebar::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover,
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* 修改容器样式 */
        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .chat-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .chat-container {
            flex: 1;
            min-height: 0;
        }

        /* 添加错误提示样式 */
        .error-message {
            background-color: #FEE2E2;
            border: 1px solid #FCA5A5;
            color: #DC2626;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: fadeIn 0.3s ease;
        }

        .error-message svg {
            width: 1.25rem;
            height: 1.25rem;
            flex-shrink: 0;
        }
    </style>
</head>

<body class="bg-gray-100">
    <!-- 左侧边栏 -->
    <div class="sidebar">
        <!-- 服务器配置 -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="flex items-center">
                <h2 class="text-xl font-semibold text-gray-800">⚙️ 服务器配置</h2>
            </div>
            <div class="mt-4">
                <div class="grid gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">OpenAI completions API URL</label>
                        <input type="text" id="apiUrl"
                            class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                            value="https://ragflow-bmhagent.wasumedia.cn/api/v1/w_agents_openai/9e6a7dbe1b2b11f08f630242c0a87006/chat/completions">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Token</label>
                        <input type="text" id="token"
                            class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                            value="ragflow-MyNTY5YWE0MWIzMDExZjBhOTY2MDI0Mm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">模型</label>
                        <input type="text" id="model"
                            class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                            value="deepseek-v3">
                    </div>
                </div>
            </div>
        </div>

        <!-- 响应统计 -->
        <div class="bg-white rounded-lg shadow-md p-4">
            <h3 class="text-lg font-semibold text-gray-800 mb-3">📊 响应统计</h3>
            <div class="text-sm">
                <div class="flex items-center justify-between">
                    <span class="text-gray-600">平均响应时间</span>
                    <span id="averageTime" class="font-medium">0.00s</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 主要聊天区域 -->
    <div class="main-content">
        <div class="container max-w-4xl mx-auto">
            <!-- 聊天区域 -->
            <div class="chat-card bg-white rounded-lg shadow-md">
                <div class="chat-container p-4" id="chatContainer">
                    <!-- 消息将在这里动态添加 -->
                </div>

                <!-- 输入区域 -->
                <div class="border-t p-4">
                    <div class="flex gap-2">
                        <textarea id="userInput"
                            class="flex-1 p-2 border rounded resize-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            rows="2" placeholder="输入您的问题..."
                            onkeydown="if(event.keyCode===13&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                        <button onclick="sendMessage()"
                            class="px-6 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                            发送
                        </button>
                    </div>
                    <div class="text-xs text-gray-500 mt-2">
                        按 Enter 发送，Shift + Enter 换行
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let totalResponseTime = 0;
        let messageCount = 0;
        let currentMessageStartTime = 0;
        let elapsedTimeInterval = null;
        let messageHistory = [];  // 存储对话历史

        const ROBOT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%237B68EE'/%3E%3Cpath d='M7.5 11c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5zm6.5 0c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5zm-8 2.5h11v1h-11v-1z' fill='white'/%3E%3C/svg%3E";
        const USER_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%239370DB'/%3E%3Cpath d='M12 7c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3zm0 7.5c2.75 0 5 1.25 5 2.5v1h-10v-1c0-1.25 2.25-2.5 5-2.5z' fill='white'/%3E%3C/svg%3E";

        function updateStats(responseTime) {
            totalResponseTime += responseTime;
            messageCount++;

            document.getElementById('averageTime').textContent =
                `${(totalResponseTime / messageCount).toFixed(2)}s`;
        }

        function updateElapsedTime(elapsedTimeElement) {
            const elapsed = (performance.now() - currentMessageStartTime) / 1000;
            elapsedTimeElement.textContent = `用时：${elapsed.toFixed(1)}秒`;
        }

        // 添加日志函数
        function log(type, message, data = null) {
            const timestamp = new Date().toISOString();
            const logMessage = {
                timestamp,
                type,
                message,
                data
            };
            console.log(`[${timestamp}] [${type}] ${message}`, data ? data : '');
        }

        function appendMessage(content, isUser = false) {
            log('INFO', `添加${isUser ? '用户' : 'AI'}消息`, content);
            const chatContainer = document.getElementById('chatContainer');
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `message-wrapper ${isUser ? 'user' : ''}`;

            // 创建头像
            const avatar = document.createElement('img');
            avatar.className = 'avatar';
            avatar.src = isUser ? USER_AVATAR : ROBOT_AVATAR;
            avatar.alt = isUser ? '用户' : 'AI助手';

            // 创建消息内容容器
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';

            // 如果是助手消息，添加用时显示
            if (!isUser) {
                const elapsedTime = document.createElement('div');
                elapsedTime.className = 'elapsed-time';
                elapsedTime.textContent = '用时：0.0秒';
                messageContent.appendChild(elapsedTime);

                // 开始计时
                currentMessageStartTime = performance.now();
                if (elapsedTimeInterval) {
                    clearInterval(elapsedTimeInterval);
                }
                elapsedTimeInterval = setInterval(() => updateElapsedTime(elapsedTime), 100);
            }

            // 创建消息气泡
            const messageDiv = document.createElement('div');
            messageDiv.className = `message p-3 ${isUser ? 'user-message' : 'assistant-message'
                }`;

            if (!isUser && content === '') {
                messageDiv.classList.add('typing-animation');
            }

            messageDiv.textContent = content;
            messageContent.appendChild(messageDiv);

            // 组装消息
            messageWrapper.appendChild(avatar);
            messageWrapper.appendChild(messageContent);
            chatContainer.appendChild(messageWrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 更新对话历史
            if (content !== '') {  // 不记录空消息
                messageHistory.push({
                    role: isUser ? 'user' : 'assistant',
                    content: content
                });
                // 只保留最近3轮对话（6条消息）
                if (messageHistory.length > 6) {
                    messageHistory = messageHistory.slice(-6);
                }
            }

            return messageDiv;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            // 清空输入框
            input.value = '';

            // 添加用户消息
            appendMessage(message, true);

            // 添加助手消息占位
            const assistantMessage = appendMessage('');

            const startTime = performance.now();

            try {
                const apiUrl = document.getElementById('apiUrl').value;
                const token = document.getElementById('token').value;
                const model = document.getElementById('model').value;

                // 记录请求信息
                log('REQUEST', '发送对话请求', {
                    url: apiUrl,
                    model: model,
                    messageCount: messageHistory.length,
                    latestMessage: message
                });

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': '*/*',
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: messageHistory.slice(-6),
                        stream: true
                    })
                });

                if (!response.ok) {
                    log('ERROR', `HTTP请求失败: ${response.status}`, {
                        status: response.status,
                        statusText: response.statusText
                    });
                    throw new Error(`HTTP错误: ${response.status} - ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        log('INFO', '流式响应完成', {
                            totalLength: fullContent.length,
                            totalTime: `${((performance.now() - startTime) / 1000).toFixed(2)}s`
                        });
                        break;
                    }

                    // 解码新的数据块并添加到缓冲区
                    buffer += decoder.decode(value, { stream: true });

                    // 处理缓冲区中的完整消息
                    const lines = buffer.split('\n');
                    buffer = ''; // 重置缓冲区

                    for (const line of lines) {
                        // 跳过空行
                        if (!line.trim()) continue;

                        // 处理数据行
                        if (line.startsWith('data: ')) {
                            const data = line.slice(5); // 移除 'data: ' 前缀

                            // 检查是否是结束标记
                            if (data === '[DONE]') {
                                log('INFO', '收到结束标记');
                                continue;
                            }

                            try {
                                const parsed = JSON.parse(data);
                                const content = parsed.choices?.[0]?.delta?.content || '';
                                if (content) {
                                    fullContent += content;
                                    assistantMessage.textContent = fullContent;
                                    
                                    log('DEBUG', '收到消息片段', {
                                        content: content,
                                        fullLength: fullContent.length
                                    });
                                }
                            } catch (e) {
                                log('WARN', '解析JSON失败，跳过此消息', {
                                    error: e.message,
                                    data: data
                                });
                                // 继续处理下一条消息，而不是抛出错误
                                continue;
                            }
                        } else {
                            // 如果不是以 'data: ' 开头的行，添加到下一次的缓冲区
                            buffer += line + '\n';
                        }
                    }
                }

                // 停止计时器
                if (elapsedTimeInterval) {
                    clearInterval(elapsedTimeInterval);
                    elapsedTimeInterval = null;
                }

                // 移除打字动画
                assistantMessage.classList.remove('typing-animation');

                // 更新统计信息
                const responseTime = (performance.now() - startTime) / 1000;
                updateStats(responseTime);

                log('INFO', '对话完成', {
                    responseTime: `${responseTime.toFixed(2)}s`,
                    messageHistoryLength: messageHistory.length
                });

            } catch (error) {
                log('ERROR', '对话请求失败', {
                    error: error.message,
                    stack: error.stack
                });

                // 创建错误提示元素
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <span>${error.message || '连接服务器失败，请检查网络或服务器配置'}</span>
                `;

                // 替换打字动画消息为错误提示
                assistantMessage.innerHTML = '';
                assistantMessage.classList.remove('typing-animation');
                assistantMessage.appendChild(errorDiv);

                // 停止计时器
                if (elapsedTimeInterval) {
                    clearInterval(elapsedTimeInterval);
                    elapsedTimeInterval = null;
                }
            }
        }
    </script>
</body>

</html>
